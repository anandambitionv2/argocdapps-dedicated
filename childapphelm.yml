apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customerapphelmbased
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: "acrwinter.azurecr.io/helm"
      chart: "helm-nginx"
      targetRevision: 0.35.0
      helm:
        valueFiles:
          - $production/values.yaml

    - repoURL: https://github.com/anandambitionv2/onlyvaluesyaml.git
      targetRevision: main
      ref: production

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

   